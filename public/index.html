<!DOCTYPE html>
<html lang="">

<head>
  <link rel="stylesheet" type="text/css" href="stylesheets/style.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMIGA Visualizer v2</title>
    <script type="text/javascript" src="libraries/mappa.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script type="text/javascript" src="libraries/quicksettings.js"></script>
    <script type="text/javascript" src="libraries/p5.gui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
    <script type="text/javascript" src="libraries/utmconv.js"></script>
    <script src="javascripts/tank.js"></script>
    <script src="javascripts/umd.js"></script>
    <script src="javascripts/sketch.js"></script>
</head>
<body>
  <!-- <h1>Map</h1> -->
    <div id="sketch-div"></div>
    
    <div id="search-panel">
      <input type="text" id="search-input" placeholder="Search SD by name or LSID..." autocomplete="off">
      <div id="search-results"></div>
    </div>
    
    <div id="selected-list-panel">
      <div class="panel-header">
        <span>Selected SDs <span id="selected-count">(0)</span></span>
        <div class="header-buttons">
          <button id="zoom-all-btn" title="Zoom to all">⊡</button>
          <button id="clear-all-btn" title="Clear all">×</button>
        </div>
      </div>
      <div id="selected-list"></div>
    </div>
</body>
</html>
